<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS 문제은행 PWA</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e293b" />
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8; --accent: #3b82f6; --correct: #22c55e; --wrong: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 720px; margin: 0 auto; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.25rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    select, button { background: var(--card); color: var(--text); border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
    button.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--sub); margin-bottom: 12px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 16px; }
    .badge { display: inline-block; font-size: 0.75rem; background: #334155; color: #cbd5e1; padding: 4px 8px; border-radius: 4px; margin-bottom: 12px; }
    .question { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; word-break: keep-all; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn { text-align: left; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; transition: 0.15s; }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.15); border-color: var(--correct); color: #86efac; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.15); border-color: var(--wrong); color: #fca5a5; }
    .explanation { margin-top: 16px; padding: 12px; background: #0f172a; border-left: 4px solid var(--accent); border-radius: 4px; font-size: 0.9rem; display: none; }
    .nav-btns { display: flex; justify-content: space-between; gap: 8px; }
    .nav-btns button { flex: 1; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>CS 문제은행</h1>
    <button id="resetBtn" style="font-size:0.75rem; padding:6px 10px;">기록 초기화</button>
  </header>

  <div class="controls">
    <select id="weekFilter"><option value="all">전체 주차 (Subject)</option></select>
    <select id="subTopicFilter"><option value="all">전체 세부단원</option></select>
    <button id="modeAll" class="active">전체 문제</button>
    <button id="modeWrong">오답 노트 (<span id="wrongCount">0</span>)</button>
  </div>

  <div class="status-bar">
    <span id="progressText">0 / 0</span>
    <span id="scoreText">완료: 0문항</span>
  </div>

  <div id="quizContainer" class="card">
    <div id="badge" class="badge"></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="explanation" class="explanation"></div>
  </div>

  <div class="nav-btns">
    <button id="prevBtn">이전 문제</button>
    <button id="nextBtn" style="background:var(--accent); border:none;">다음 문제</button>
  </div>

  <script src="/questions.js"></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
